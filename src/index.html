<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Creation, Submission, and Approval System</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>Invoice Creation, Submission, and Approval System</h1>
  </header>

  <main>
    <section>
      <h2>Create Invoice</h2>

      <p>
        Enter the invoice information below to create and submit
        an invoice for review and approval.
      </p>

      <form>

        <fieldset>
          <legend>Invoice Details</legend>

          <label for="invoiceNumber">Invoice Number</label>
          <input
            type="text"
            id="invoiceNumber"
            name="invoiceNumber"
            required>

          <br><br>

          <label for="invoiceDate">Invoice Date</label>
          <input
            type="date"
            id="invoiceDate"
            name="invoiceDate"
            required>

          <br><br>

          <label for="customerName">Customer Name</label>
          <input
            type="text"
            id="customerName"
            name="customerName"
            required>

          <br><br>

          <label for="amount">Invoice Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            required>

        </fieldset>

        <br>

        <fieldset>
          <legend>Invoice Information</legend>
<label for="invoiceStatus">Invoice Status</label>
<select id="invoiceStatus" name="invoiceStatus">
  <option value="">Select a status</option>
  <option value="Draft">Draft</option>
  <option value="Submitted">Submitted</option>
  <option value="Under Review">Under Review</option>
  <option value="Approved">Approved</option>
</select>

<p id="approvalMessage"></p>

<br>
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            cols="40"
            ></textarea>

          <br><br>

          <label for="department">Department</label>
          <select
            id="department"
            name="department"
            required>

            <option value="">Select a department</option>
            <option value="billing">Billing</option>
            <option value="accounting">Accounting</option>
            <option value="operations">Operations</option>

          </select>

        </fieldset>

        <br>

        <fieldset>
          <legend>Approval Information</legend>

          <p>Priority</p>

          <input
            type="radio"
            id="normal"
            name="priority"
            value="normal"
            required>
          <label for="normal">Normal</label>

          <input
            type="radio"
            id="urgent"
            name="priority"
            value="urgent">
          <label for="urgent">Urgent</label>

          <br><br>

          <input
            type="checkbox"
            id="confirmation"
            name="confirmation"
            required>
          <label for="confirmation">
            I confirm that the invoice information is accurate.
          </label>

        </fieldset>

        <br>
<p id="formMessage" role="status" aria-live="polite"></p>
        <button type="submit">Submit Invoice</button>
        <button type="reset">Clear Form</button>

      </form>
    </section>
  </main>

  <footer>
    <p>Invoice Creation, Submission, and Approval System</p>
  </footer>
<script src="app.js"></script>
</body>

</html>
